<ng-container *transloco="let t; read: 'auth.register.rules'">
  <p class="cap"><svg lucideCircleExclamationPoint aria-hidden="true"></svg>{{ t('caption') }}</p>
  <ul class="rules">
    @for (rule of rules; track rule) {
      @let ok = checks()[rule];
      <li [class.ok]="ok" [class.bad]="!ok">
        <span>{{ t(rule) }}</span>
        <span class="state">
          @if (ok) {
            <svg lucideCheck aria-hidden="true"></svg>
          } @else {
            <svg lucideX aria-hidden="true"></svg>
          }
          <span class="vd-sr">{{ t(ok ? 'done' : 'missing') }}</span>
        </span>
      </li>
    }
  </ul>
  <p class="note">{{ t('special') }}</p>
</ng-container>
