<ng-container *transloco="let t; read: 'auth.password'">
  <input
    class="vd-input"
    [class.vd-input--lg]="size() === 'lg'"
    [class.receipt]="size() === 'receipt'"
    [id]="inputId()"
    [type]="visible() ? 'text' : 'password'"
    [autocomplete]="autocomplete()"
    [formField]="field()"
    [attr.aria-invalid]="invalid() ? true : null"
    [attr.aria-describedby]="describedBy()"
  />
  <button
    class="eye"
    type="button"
    [attr.aria-controls]="inputId()"
    [attr.aria-pressed]="visible()"
    [attr.aria-label]="t(visible() ? 'hide' : 'show')"
    (click)="toggle()"
  >
    @if (visible()) {
      <svg lucideEyeOff aria-hidden="true"></svg>
    } @else {
      <svg lucideEye aria-hidden="true"></svg>
    }
  </button>
</ng-container>
